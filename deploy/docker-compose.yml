# Production setup: backend + MinIO (media). The host's nginx terminates HTTPS and
# proxies momentum.mal-zeta.de to 127.0.0.1:8095. Secrets come from .env next to this file.
# Container logs are rotated (a runaway log once filled the host's disk and MinIO refused every upload).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8095:8000"
    environment:
      MOMENTUM_DB: sqlite+aiosqlite:////data/momentum.db
      MOMENTUM_TZ: Europe/Berlin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      # sign in with Google (server/google.py) and the operator on /legal - set in .env, empty = off / placeholder
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MOMENTUM_OPERATOR: ${MOMENTUM_OPERATOR:-}
      # bug reports / feature requests as issues of the public repo (server/github.py) - empty = off
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # e-mails with codes: confirm the address, new password (server/mail.py) - empty = off
      MAIL_TENANT_ID: ${MAIL_TENANT_ID:-}
      MAIL_CLIENT_ID: ${MAIL_CLIENT_ID:-}
      MAIL_CLIENT_SECRET: ${MAIL_CLIENT_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # calls (server/calls.py): the TURN relay below - its address and the shared secret for its logins
      TURN_HOST: ${TURN_HOST:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - app-data:/data
      # the release APK offered at /app.apk (copied here on deploy)
      - ./apk:/app/android/app/build/outputs/apk/release:ro
      # the admin app at /admin.apk (deploy.sh --admin)
      - ./apk-admin:/app/android/admin/build/outputs/apk/release:ro
    depends_on:
      - minio

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    logging: *logging
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/bitnami/minio/data

  # TURN relay for calls (server/calls.py): phones that can't reach each other directly talk through it (the sound
  # and picture stay encrypted, the relay can't read them). Host network: UDP/TCP 3478 and the relay ports
  # 49160-49200/udp (registered in /opt/USED_PORTS.md, open in the firewall). Logins: time-limited, made by the app
  # from TURN_SECRET; relaying into private / local networks is refused.
  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    logging: *logging
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --listening-ip=${TURN_IP}
      - --relay-ip=${TURN_IP}
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=momentum.mal-zeta.de
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --total-quota=100
      - --max-bps=3000000
      - --log-file=stdout
      - --simple-log

volumes:
  app-data:
  minio-data:
