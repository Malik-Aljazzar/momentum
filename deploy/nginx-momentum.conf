# /etc/nginx/sites-available/momentum.mal-zeta.de.conf
# Certificate: certbot certonly --webroot -w /var/www/certbot -d momentum.mal-zeta.de
server {
    listen 80;
    listen [::]:80;
    server_name momentum.mal-zeta.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name momentum.mal-zeta.de;

    ssl_certificate /etc/letsencrypt/live/momentum.mal-zeta.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/momentum.mal-zeta.de/privkey.pem;

    # raw photo/video uploads (the backend compresses them); matches MAX_CONTENT_LENGTH
    client_max_body_size 200m;

    # calls (server/calls.py): the websocket stays open while the app runs
    location /api/calls/ws {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;        # video processing
    }
}
